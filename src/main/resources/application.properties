spring.application.name=demo_blackbaze_b2


server.port=8080

# H2
spring.datasource.url=jdbc:h2:mem:b2demo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console H2 accessible sur http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# B2 - lues depuis .env
backblaze.b2.endpoint=${B2_ENDPOINT}
backblaze.b2.region=${B2_REGION}
backblaze.b2.access-key=${B2_ACCESS_KEY}
backblaze.b2.secret-key=${B2_SECRET_KEY}
backblaze.b2.bucket-name=${B2_BUCKET_NAME}

# Upload max
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB